<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Domain Sniper{% endblock %}</title>

    <!-- Bootstrap 5 CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --bs-body-bg: #1a1a2e;
            --bs-body-color: #eee;
            --bs-card-bg: #16213e;
            --bs-border-color: #0f3460;
        }

        body {
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            min-height: 100vh;
        }

        .navbar {
            background-color: #0f3460 !important;
        }

        .card {
            background-color: var(--bs-card-bg);
            border-color: var(--bs-border-color);
        }

        .table {
            color: var(--bs-body-color);
        }

        .table-hover tbody tr:hover {
            background-color: rgba(15, 52, 96, 0.5);
        }

        .score-badge {
            font-size: 1rem;
            font-weight: bold;
            min-width: 50px;
        }

        .domain-name {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 1.1rem;
            color: #00d9ff;
        }

        .expiry-urgent {
            color: #ff4444;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.5; }
        }

        .stat-card {
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
        }

        .footer {
            background-color: #0f3460;
            padding: 1rem 0;
            margin-top: 2rem;
        }

        /* 스크롤바 스타일 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #0f3460;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #e94560;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 네비게이션 -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-bullseye"></i> Domain Sniper
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
                            <i class="bi bi-house"></i> 홈
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/watchlist' %}active{% endif %}" href="/watchlist">
                            <i class="bi bi-star"></i> 관심목록
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/logs' %}active{% endif %}" href="/logs">
                            <i class="bi bi-journal-text"></i> 로그
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/settings' %}active{% endif %}" href="/settings">
                            <i class="bi bi-gear"></i> 설정
                        </a>
                    </li>
                </ul>
                <span class="navbar-text">
                    <span class="badge bg-success">
                        <i class="bi bi-circle-fill"></i> 운영중
                    </span>
                </span>
            </div>
        </div>
    </nav>

    <!-- 메인 컨텐츠 -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- 푸터 -->
    <footer class="footer text-center text-muted">
        <div class="container">
            <small>
                Domain Sniper v1.0.0 | Raspberry Pi 4 Edition |
                <i class="bi bi-github"></i> Open Source
            </small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
